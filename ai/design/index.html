<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面デザインスタイル - プレビュー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #1a1a1a;
      --primary-hover: #2d2d2d;
      --accent-color: #8b7355;
      --sidebar-bg: #1f1f1f;
      --card-bg: #ffffff;
      --card-border: #e5e5e5;
      --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b6b;
      --border-color: #d4d4d4;
    }

    body {
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      overflow-x: hidden;
      background: #fafafa;
      min-height: 100vh;
      color: var(--text-primary);
    }

    /* レイアウト */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* サイドバー */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      width: 260px;
      background: var(--sidebar-bg);
      color: #e8e8e8;
      padding: 2rem 1.5rem;
      overflow-y: auto;
      z-index: 1000;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .sidebar-logo {
      font-weight: 600;
      font-size: 1.25rem;
      margin-bottom: 3rem;
      color: #ffffff;
      letter-spacing: 0.05em;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-menu {
      list-style: none;
    }

    .sidebar-menu-item {
      margin-bottom: 0.5rem;
    }

    .sidebar-menu-link {
      display: block;
      padding: 0.875rem 1rem;
      text-decoration: none;
      color: #b8b8b8;
      transition: color 0.2s ease;
      cursor: pointer;
      font-size: 0.9375rem;
      letter-spacing: 0.01em;
      border-left: 2px solid transparent;
    }

    .sidebar-menu-link i {
      display: none;
    }

    .sidebar-menu-link:hover {
      color: #ffffff;
    }

    .sidebar-menu-link.active {
      color: #ffffff;
      font-weight: 500;
      border-left-color: var(--accent-color);
      background: rgba(139, 115, 85, 0.08);
    }

    /* メインコンテンツ */
    .main-content {
      flex: 1;
      margin-left: 260px;
      background: transparent;
      color: var(--text-primary);
    }

    /* ヘッダー */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      padding: 0 2.5rem;
      background: #ffffff;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-color);
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.01em;
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    /* コンテンツエリア */
    .content-area {
      padding: 2rem 2.5rem;
    }

    /* カード */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--card-shadow);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
      letter-spacing: 0.01em;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    /* ボタン */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 500;
      border: 1px solid transparent;
      border-radius: 2px;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .btn i {
      display: none;
    }

    .btn-primary {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-secondary {
      background: #ffffff;
      border-color: var(--border-color);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: #fafafa;
      border-color: var(--accent-color);
      color: var(--text-primary);
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* 入力フィールド */
    .form-group {
      margin-bottom: 1.75rem;
    }

    .form-label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-primary);
      letter-spacing: 0.01em;
    }

    .form-label i {
      display: none;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 2px;
      font-size: 0.9375rem;
      transition: border-color 0.2s ease;
      background: #ffffff;
      color: var(--text-primary);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .form-input::placeholder {
      color: #9CA3AF;
    }

    /* テーブル */
    .table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
      background: #ffffff;
    }

    .table thead {
      background: #fafafa;
    }

    .table th,
    .table td {
      padding: 1rem 1.25rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .table th {
      font-weight: 500;
      font-size: 0.8125rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .table td {
      color: var(--text-primary);
      font-size: 0.9375rem;
    }

    .table tbody tr {
      background: #ffffff;
    }

    .table tbody tr:hover {
      background: #fafafa;
    }

    .table tbody tr:last-child td {
      border-bottom: none;
    }

    /* ステータスバッジ */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 2px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .badge i {
      display: none;
    }

    .badge-success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }

    .badge-warning {
      background: #fff3e0;
      color: #e65100;
      border: 1px solid #ffe0b2;
    }

    .badge-error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }

    /* スクロールバーのスタイリング */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f5f5f5;
    }

    ::-webkit-scrollbar-thumb {
      background: #c0c0c0;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a0a0a0;
    }
  </style>
</head>

<body>
  <div class="layout">
    <!-- サイドバー -->
    <aside class="sidebar">
      <div class="sidebar-logo">管理画面</div>
      <ul class="sidebar-menu">
        <li class="sidebar-menu-item">
          <a href="#" class="sidebar-menu-link active">ダッシュボード</a>
        </li>
        <li class="sidebar-menu-item">
          <a href="#" class="sidebar-menu-link">ユーザー管理</a>
        </li>
        <li class="sidebar-menu-item">
          <a href="#" class="sidebar-menu-link">商品管理</a>
        </li>
        <li class="sidebar-menu-item">
          <a href="#" class="sidebar-menu-link">注文管理</a>
        </li>
        <li class="sidebar-menu-item">
          <a href="#" class="sidebar-menu-link">レポート</a>
        </li>
        <li class="sidebar-menu-item">
          <a href="#" class="sidebar-menu-link">設定</a>
        </li>
      </ul>
    </aside>

    <!-- メインコンテンツ -->
    <main class="main-content">
      <!-- ヘッダー -->
      <header class="header">
        <h1 class="header-title">ダッシュボード</h1>
        <div class="header-actions">
          <button class="btn btn-secondary">検索</button>
          <button class="btn btn-primary">新規作成</button>
        </div>
      </header>

      <!-- コンテンツエリア -->
      <div class="content-area">
        <!-- カード1: 概要 -->
        <div class="card">
          <h2 class="card-title">概要</h2>
          <p style="color: #6B7280; margin-bottom: 2rem; line-height: 1.7;">システムの概要情報を表示します。</p>

          <div class="btn-group">
            <button class="btn btn-primary">
              <i class="fas fa-check"></i>
              <span>プライマリボタン</span>
            </button>
            <button class="btn btn-secondary">
              <i class="fas fa-times"></i>
              <span>セカンダリボタン</span>
            </button>
          </div>
        </div>

        <!-- カード2: フォーム -->
        <div class="card">
          <h2 class="card-title">フォーム要素</h2>

          <div class="form-group">
            <label class="form-label">ユーザー名</label>
            <input type="text" class="form-input" placeholder="ユーザー名を入力">
          </div>

          <div class="form-group">
            <label class="form-label">メールアドレス</label>
            <input type="email" class="form-input" placeholder="example@example.com">
          </div>

          <div class="form-group">
            <label class="form-label">パスワード</label>
            <input type="password" class="form-input" placeholder="パスワードを入力">
          </div>

          <div class="btn-group">
            <button class="btn btn-primary">送信</button>
            <button class="btn btn-secondary">キャンセル</button>
          </div>
        </div>

        <!-- カード3: テーブル -->
        <div class="card">
          <h2 class="card-title">データテーブル</h2>

          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>名前</th>
                <th>メール</th>
                <th>ステータス</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>001</strong></td>
                <td>山田 太郎</td>
                <td>yamada@example.com</td>
                <td><span class="badge badge-success">有効</span></td>
                <td>
                  <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">編集</button>
                </td>
              </tr>
              <tr>
                <td><strong>002</strong></td>
                <td>佐藤 花子</td>
                <td>sato@example.com</td>
                <td><span class="badge badge-success">有効</span></td>
                <td>
                  <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">編集</button>
                </td>
              </tr>
              <tr>
                <td><strong>003</strong></td>
                <td>鈴木 一郎</td>
                <td>suzuki@example.com</td>
                <td><span class="badge badge-warning">保留</span></td>
                <td>
                  <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">編集</button>
                </td>
              </tr>
              <tr>
                <td><strong>004</strong></td>
                <td>田中 次郎</td>
                <td>tanaka@example.com</td>
                <td><span class="badge badge-error">無効</span></td>
                <td>
                  <button class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">編集</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- カード4: ステータス表示 -->
        <div class="card">
          <h2 class="card-title">ステータス表示</h2>

          <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem;">
            <span class="badge badge-success">成功</span>
            <span class="badge badge-warning">警告</span>
            <span class="badge badge-error">エラー</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // サイドバーメニューのアクティブ状態切り替え
    document.querySelectorAll('.sidebar-menu-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('.sidebar-menu-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });
  </script>
</body>

</html>
